<!DOCTYPE html>
<html lang="nl">
<head>

    <!-- Google Fonts voor Lato en Cinzel Decorative (het perfecte Maragsa alternatief) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <!-- FontAwesome voor Social Media Icoontjes -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { background-color: #f8ecec; color: #d32f2f; font-family: 'Lato', sans-serif; line-height: 1.6; padding-top: 70px; }
        
        h1, h2, h3, h4 {
            font-family: 'Cinzel Decorative', Georgia, serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* 1. De compacte bovenbalk exact in de stijl en kleur van de footer */
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background-color: #d32f2f; 
            z-index: 1000; 
            padding: 15px 5%; 
            display: flex; 
            justify-content: center; /* Gecentreerd op grote schermen */
            align-items: center; 
        }
        nav { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 1100px; }
        nav a { 
            color: #f8ecec; 
            text-decoration: none; 
            margin: 5px 15px; 
            font-family: 'Lato', sans-serif;
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
            letter-spacing: 2px; 
            transition: opacity 0.3s; 
        }
        nav a:hover { opacity: 0.7; }
        
        /* Gsm-vriendelijke taalknop in de menubalk */
        .lang-btn { background-color: transparent; border: 1px solid #f8ecec; color: #f8ecec; padding: 4px 10px; margin-left: 15px; font-family: 'Lato', sans-serif; font-weight: 700; cursor: pointer; border-radius: 2px; transition: all 0.3s; font-size: 0.85rem; }
        .lang-btn:hover { background-color: #f8ecec; color: #d32f2f; }

        section { padding: 100px 5%; min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 1px solid rgba(211, 47, 47, 0.15); }
        
        /* 2. De nieuwe Home / Over mij pagina layout */
        #home { padding-top: 120px; }
        .about-container { display: flex; align-items: center; justify-content: space-between; max-width: 1100px; width: 100%; gap: 50px; text-align: left; }
        .about-text { flex: 1; }
        /* Perforé titel groter gemaakt dan de subkop */
        .about-text h1 { font-size: 2.8rem; margin-bottom: 10px; letter-spacing: 4px; color: #d32f2f; font-family: 'Cinzel Decorative', Georgia, serif; }
        .about-text h3 { font-family: 'Lato', sans-serif; font-size: 1.4rem; font-weight: 300; letter-spacing: 1px; color: #d32f2f; text-transform: none; margin-bottom: 25px; }
        .about-text p { font-size: 1.25rem; margin-bottom: 20px; font-weight: 400; text-align: justify; }
        .about-image-wrapper { flex: 0 0 380px; }
        .about-image-placeholder { width: 100%; height: 480px; background-color: rgba(211, 47, 47, 0.05); border: 3px solid #d32f2f; display: flex; justify-content: center; align-items: center; font-style: italic; font-size: 1.1rem; }
        .about-image-placeholder img { width: 100%; height: 100%; object-fit: cover; }

        /* Algemene Sectie Titels */
        section h2 { font-size: 2.5rem; margin-bottom: 40px; position: relative; padding-bottom: 15px; text-align: center; width: 100%; letter-spacing: 3px; }
        section h2::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 1px; background-color: #d32f2f; }
        .container { max-width: 1100px; width: 100%; text-align: center; }
        .section-desc { font-size: 1.3rem; max-width: 850px; margin: 0 auto 30px auto; text-align: center; font-weight: 300; letter-spacing: 0.5px; }

        /* Prijzenlijst */
        .price-list { margin: 30px auto 0 auto; text-align: left; max-width: 700px; }
        .price-item { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(211, 47, 47, 0.25); padding: 15px 0; font-size: 1.25rem; }
        .price-item span:first-child { font-weight: 700; }
        
        /* De leeftijdskader */
        .rules-box { border: 1px solid #d32f2f; padding: 25px; margin-top: 45px; max-width: 700px; margin-left: auto; margin-right: auto; text-align: center; background-color: rgba(211, 47, 47, 0.02); }
        .rules-box p { font-size: 1.15rem; margin-bottom: 10px; font-weight: 400; }
        .rules-box p:last-child { margin-bottom: 0; }

        /* 3. Juwelen webshop (Strakke 4-koloms grid) */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; width: 100%; }
        .product-card { background: rgba(211, 47, 47, 0.02); border: 1px solid rgba(211, 47, 47, 0.15); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .product-img-placeholder { width: 100%; height: 160px; background-color: rgba(211, 47, 47, 0.06); margin-bottom: 15px; display: flex; justify-content: center; align-items: center; font-style: italic; }
        .product-card h3 { font-size: 1.1rem; margin-bottom: 8px; font-family: 'Lato', sans-serif; font-weight: 700; text-transform: none; letter-spacing: 0px; }
        .price { font-weight: 700; margin-bottom: 15px; font-size: 1.1rem; }

        /* 5. Gecentreerd kader voor Huisregels */
        .info-card { max-width: 800px; border: 1px solid #d32f2f; background-color: rgba(211, 47, 47, 0.02); padding: 40px; margin: 30px auto 0 auto; text-align: center; }
        .info-card p { font-size: 1.25rem; margin-bottom: 30px; font-weight: 400; line-height: 1.6; }
        .rules-grid { display: flex; flex-direction: column; gap: 25px; text-align: center; }
        .rule-text { font-size: 1.15rem; font-weight: 400; line-height: 1.6; max-width: 700px; margin: 0 auto; position: relative; padding-top: 15px; border-top: 1px dashed rgba(211, 47, 47, 0.2); }
        .rule-text:first-of-type { border-top: none; padding-top: 0; }

        /* Knoppen & Boeken */
        .btn { display: inline-block; background-color: #d32f2f; color: #f8ecec; padding: 16px 45px; text-decoration: none; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; border: none; cursor: pointer; font-size: 1.05rem; font-family: 'Lato', sans-serif; transition: all 0.3s; border-radius: 0px; }
        .btn:hover { background-color: #b72525; transform: translateY(-1px); }
        .btn-sm { padding: 10px 15px; font-size: 0.8rem; width: 100%; text-transform: uppercase; }

        /* Opvallende PS styling */
        .ps-box { margin-top: 40px; font-size: 1.1rem; font-style: italic; font-weight: 300; background-color: rgba(211, 47, 47, 0.05); padding: 15px 25px; border-left: 3px solid #d32f2f; display: inline-block; text-align: left; max-width: 600px; }

        /* Portfolio & Fotogalerij */
        .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; margin-top: 20px; }
        .gallery-item { width: 100%; height: 260px; background-color: rgba(211, 47, 47, 0.06); display: flex; justify-content: center; align-items: center; font-style: italic; border: 1px solid rgba(211, 47, 47, 0.1); }

        /* Prachtige Volledig Rode Footer */
        footer { background-color: #d32f2f; color: #f8ecec; padding: 60px 5% 40px 5%; text-align: center; border-top: none; }
        .footer-container { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 1100px; margin: 0 auto; gap: 40px; text-align: center; align-items: start; }
        .footer-column h4 { font-size: 1.2rem; margin-bottom: 15px; letter-spacing: 1px; color: #f8ecec; }
        .footer-column p { font-size: 1.15rem; font-weight: 300; color: #f8ecec; }
        .footer-column a { color: #f8ecec; text-decoration: none; font-size: 1.15rem; font-weight: 400; }
        .footer-socials { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        /* 4. Social media logo's met witte bol en rode letters */
        .footer-social-btn { color: #d32f2f; background-color: #f8ecec; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; text-decoration: none; transition: transform 0.2s; }
        .footer-social-btn:hover { transform: scale(1.1); }
        .footer-quote { max-width: 900px; margin: 50px auto 0 auto; font-size: 1.1rem; font-style: italic; font-weight: 300; line-height: 1.6; border-top: 1px solid rgba(248, 236, 236, 0.2); padding-top: 25px; color: #f8ecec; }

        [lang="en"] { display: none; }

        /* 2. Super strakke gsm-optimalisatie voor alle schermen */
        @media (max-width: 992px) { 
            .grid, .gallery { grid-template-columns: repeat(2, 1fr); } 
            .about-container { flex-direction: column; text-align: center; } 
            .about-text h1, .about-text h3, .about-text p { text-align: center; } 
            .about-image-wrapper { flex: 0 0 auto; width: 100%; max-width: 320px; margin: 0 auto; } 
            .footer-container { grid-template-columns: 1fr; gap: 35px; }
        }
        @media (max-width: 768px) { 
            header { padding: 15px 3%; } 
            nav a { margin: 5px 8px; font-size: 0.8rem; letter-spacing: 1px; } 
    <!-- 2. DIENSTEN & PRIJZEN SECTIE -->

    <!-- SLIM TAALSYSTEEM SCRIPT -->
    <script>
        let currentLang = 'nl';

        function toggleLanguage() {
            const btn = document.querySelector('.lang-btn');
            
            if (currentLang === 'nl') {
                currentLang = 'en';
                btn.innerText = 'NL';
                
                document.querySelector('.nav-home').innerText = 'Home';
                document.querySelector('.nav-piercings').innerText = 'Prices';
                document.querySelector('.nav-jewelry').innerText = 'Shop';
                document.querySelector('.nav-rules').innerText = 'Rules';
                document.querySelector('.nav-portfolio').innerText = 'Portfolio';
                document.querySelector('.nav-contact').innerText = 'Booking';
                
                document.querySelectorAll('[lang="en"]').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.slogan-nl, .content-nl, .title-nl, .section-desc-nl, .rules-box-nl, .rules-list-nl, .f-title-1-nl, .f-title-2-nl, .f-title-3-nl, .footer-quote-nl').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.section-desc-en').forEach(el => el.style.display = 'block');
                
                document.querySelector('.main-btn').innerText = 'Book here!';
                document.querySelectorAll('.order-btn').forEach(el => el.innerText = 'Order via WhatsApp');
            } else {
                currentLang = 'nl';
                btn.innerText = 'EN';
                
                document.querySelector('.nav-home').innerText = 'Home';
                document.querySelector('.nav-piercings').innerText = 'Diensten & Prijzen';
                document.querySelector('.nav-jewelry').innerText = 'Shop';
                document.querySelector('.nav-rules').innerText = 'Huisregels';
                document.querySelector('.nav-portfolio').innerText = 'Portfolio';
                document.querySelector('.nav-contact').innerText = 'Afspraak';
                
                document.querySelectorAll('[lang="en"]').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.slogan-nl, .content-nl, .title-nl, .section-desc-nl, .rules-box-nl, .rules-list-nl, .f-title-1-nl, .f-title-2-nl, .f-title-3-nl, .footer-quote-nl').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.section-desc-en').forEach(el => el.style.display = 'none');
                
                document.querySelector('.main-btn').innerText = 'Boek hier!';
                document.querySelectorAll('.order-btn').forEach(el => el.innerText = 'Bestel via WhatsApp');
            }
        }
    </script>
